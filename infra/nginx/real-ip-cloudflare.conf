# Behind Cloudflare Tunnel every request reaches nginx from the `cloudflared`
# container, so $remote_addr would be that container for ALL visitors (breaking
# per-visitor rate limits). Trust Cloudflare's CF-Connecting-IP header — but only
# from private Docker networks, where cloudflared lives. nginx is never published
# to the internet in this setup, so the header cannot be spoofed from outside.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

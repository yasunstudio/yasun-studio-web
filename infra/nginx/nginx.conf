# Yasun Studio — edge gateway
#   /api/*, /health → FastAPI
#   everything else → Next.js (public site, learner area, /admin dashboard)
#
# NOTE: nginx does NOT inherit `proxy_set_header` into a location that defines
# any proxy_set_header of its own. Shared headers therefore live in
# proxy_headers.conf and are included in every proxied location.
worker_processes auto;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  keepalive_timeout 65;
  client_max_body_size 10m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Optional real-client-IP rules (e.g. behind Cloudflare Tunnel). Empty in local dev;
  # the production gateway image ships conf.d/real-ip/cloudflare.conf. Must load before
  # anything that uses $remote_addr (rate limiting, X-Real-IP).
  include /etc/nginx/conf.d/real-ip/*.conf;

  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  # Re-resolve container names via Docker DNS so restarts/redeploys of backend or
  # frontend (new container IPs) never leave nginx pointing at a dead address.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream api {
    zone upstream_api 64k;
    server backend:8000 resolve;
    keepalive 32;
  }
  upstream web {
    zone upstream_web 64k;
    server frontend:3000 resolve;
    keepalive 32;
  }

  map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;

    # Gateway liveness for Docker healthchecks (does not touch the apps).
    location = /nginx-health {
      access_log off;
      return 200 "ok";
    }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      include /etc/nginx/proxy_headers.conf;
      proxy_set_header Connection "";
      proxy_pass http://api;
    }

    location = /health {
      include /etc/nginx/proxy_headers.conf;
      proxy_pass http://api;
    }

    location /_next/static/ {
      include /etc/nginx/proxy_headers.conf;
      proxy_pass http://web;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location / {
      include /etc/nginx/proxy_headers.conf;
      # WebSocket upgrade (Next.js HMR in dev); keep-alive otherwise.
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://web;
    }
  }
}

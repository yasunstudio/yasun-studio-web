# =============================================================================
# Yasun Studio — base stack (production-ready defaults)
#   Dev  : docker compose up            (auto-merges docker-compose.override.yml)
#   Prod : docker compose -f docker-compose.yml up -d --build
# =============================================================================
name: ${COMPOSE_PROJECT_NAME:-yasun-studio}

x-restart: &restart
  restart: unless-stopped

services:
  db:
    image: postgres:18.7-alpine
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  redis:
    image: redis:8.8-alpine
    <<: *restart
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  backend:
    build:
      context: ./backend
      target: prod
    <<: *restart
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [backend, frontend]

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    <<: *restart
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      COOKIE_INSECURE: ${COOKIE_INSECURE:-false}
    depends_on:
      backend: { condition: service_healthy }
    networks: [frontend]

  nginx:
    image: nginx:1.31-alpine
    <<: *restart
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
    depends_on: [frontend, backend]
    networks: [frontend]

volumes:
  pgdata:
  redisdata:

networks:
  backend:
  frontend:
